<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
</head>
<body>

  <div class="cart-container">
    <h2>Your Shopping Cart</h2>
    
    <ul id="cart-items">
      <li class="cart-item">
        Samsung Galaxy S24 
        <button class="delete-btn">X</button>
      </li>
    </ul>

    <div class="checkout-box">
      <h3>Total Amount: <span class="total-price">৳ 120000</span></h3>
      <button class="checkout-btn">Checkout</button>
    </div>
  </div>

</body>
</html>
